<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aapka AI – Enterprise Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body{font-family:Inter,system-ui,sans-serif}
    .nav-item:hover{background:#f3f4f6}
    .nav-item.active{background:#111827;color:#fff!important}
    .nav-item.active i{color:#fff!important}
    .search-hit:hover{background:#f3f4f6}
  </style>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex">
<aside class="w-64 bg-white border-r flex flex-col h-screen sticky top-0 shrink-0">
  <div class="px-4 py-4 border-b flex items-center gap-2">
    <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center text-sm font-bold">A</div>
    <div><div class="font-semibold text-sm">Aapka AI</div><div class="text-[10px] text-gray-500">Enterprise Console</div></div>
  </div>
  <div class="px-3 py-3 border-b relative">
    <input id="globalSearch" placeholder="Search modules..." class="w-full pl-3 pr-3 py-2 text-sm border rounded-lg bg-gray-50 outline-none focus:ring-2 focus:ring-indigo-500" oninput="runSearch(this.value)">
    <div id="searchDrop" class="hidden absolute z-50 left-3 right-3 mt-1 bg-white border rounded-lg shadow-lg max-h-56 overflow-y-auto text-sm"></div>
  </div>
  <nav id="sidebarNav" class="flex-1 overflow-y-auto py-2 text-sm"></nav>
  <div class="p-3 border-t text-[11px] text-gray-500">
    <div id="subBadge" class="font-medium text-emerald-600">...</div>
    <a href="/customer" class="text-indigo-600 hover:underline mt-1 inline-block">Customer Portal →</a>
  </div>
</aside>
<div class="flex-1 flex flex-col min-w-0">
  <header class="bg-white border-b px-6 py-3 flex items-center justify-between sticky top-0 z-30">
    <div><h1 id="pageTitle" class="font-semibold text-lg">Home</h1><p id="pageSub" class="text-xs text-gray-500">Live data</p></div>
    <div class="flex gap-2 items-center text-xs">
      <span id="hdrStatus" class="px-2 py-1 rounded-full bg-emerald-50 text-emerald-700 font-medium">...</span>
      <button onclick="load()" class="px-3 py-1.5 border rounded-lg hover:bg-gray-50">Refresh</button>
    </div>
  </header>
  <main id="main" class="flex-1 p-6 overflow-y-auto"></main>
</div>
<script src="/admin-app.js"></script>
</body>
</html>
