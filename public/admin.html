<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aapka AI Console</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body{font-family:Inter,system-ui,sans-serif}
.drawer{transform:translateX(-100%);transition:transform .2s}
.drawer.open{transform:translateX(0)}
.overlay{opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:auto}
</style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">
<header class="bg-white border-b px-4 py-3 flex items-center gap-3 sticky top-0 z-40">
  <button onclick="toggleMenu()" class="w-10 h-10 rounded-lg hover:bg-gray-100 flex items-center justify-center"><i class="fas fa-bars"></i></button>
  <div class="flex items-center gap-2 flex-1 min-w-0">
    <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center text-sm font-bold">A</div>
    <div class="min-w-0"><div class="font-semibold text-sm">Aapka AI</div><div class="text-[10px] text-gray-500 truncate" id="topSub">Enterprise Console</div></div>
  </div>
  <span id="liveBadge" class="text-[10px] px-2 py-1 rounded-full bg-emerald-50 text-emerald-700 font-medium">Live</span>
  <a href="/customer" class="text-xs text-indigo-600">Customer</a>
</header>
<div id="overlay" class="overlay fixed inset-0 bg-black/30 z-40" onclick="toggleMenu(false)"></div>
<aside id="drawer" class="drawer fixed left-0 top-0 bottom-0 w-72 bg-white z-50 shadow-xl flex flex-col">
  <div class="p-4 border-b flex justify-between items-center"><span class="font-semibold text-sm">All tools</span>
  <button onclick="toggleMenu(false)" class="w-8 h-8 rounded-lg hover:bg-gray-100"><i class="fas fa-times text-gray-500"></i></button></div>
  <div class="p-3 border-b"><input id="drawerSearch" placeholder="Filter list..." class="w-full text-sm border rounded-lg px-3 py-2" oninput="buildDrawer(this.value)"></div>
  <nav id="drawerNav" class="flex-1 overflow-y-auto text-sm py-2"></nav>
</aside>
<main id="main" class="flex-1 overflow-y-auto px-4 py-6 pb-32 max-w-3xl mx-auto w-full"></main>
<div class="fixed bottom-0 left-0 right-0 bg-gradient-to-t from-gray-50 via-gray-50 to-transparent pt-6 pb-4 px-4 z-30">
  <div class="max-w-3xl mx-auto relative">
    <div id="searchHits" class="hidden absolute bottom-full left-0 right-0 mb-2 bg-white border rounded-2xl shadow-lg max-h-64 overflow-y-auto"></div>
    <div class="bg-white border border-gray-300 rounded-2xl shadow-sm flex items-center gap-2 px-4 py-3 focus-within:ring-2 focus-within:ring-indigo-500">
      <i class="fas fa-search text-gray-400"></i>
      <input id="bottomSearch" type="text" placeholder="Search any tool..." class="flex-1 text-sm outline-none bg-transparent" oninput="bottomSearch(this.value)" onkeydown="if(event.key==='Enter')pickFirstHit()">
      <button onclick="toggleMenu(true)" class="text-xs text-gray-500">All</button>
    </div>
  </div>
</div>
<script src="/admin-app.js"></script>
</body></html>
